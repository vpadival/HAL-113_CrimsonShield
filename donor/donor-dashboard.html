<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Donor Dashboard · Crimson Shield</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Plus Jakarta Sans", sans-serif;
  background: linear-gradient(135deg, #0b1219 0%, #151f2c 100%);
  color: #e2e8f0;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background: rgba(18,25,35,0.95);
  border-right:1px solid rgba(220,38,38,0.2);
  padding:2rem 1.5rem;
  display:flex;
  flex-direction:column;
}

.logo { font-size:1.6rem; font-weight:800; margin-bottom:3rem; }
.logo span { color:#dc2626; }

.nav button {
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  border-radius:15px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

.nav button:hover,
.nav button.active {
  background: rgba(220,38,38,0.15);
  color:white;
}

.logout {
  margin-top:auto;
  background:#dc2626;
  border:none;
  padding:0.8rem;
  border-radius:15px;
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* MAIN */
.main { flex:1; padding:2rem; }

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:2rem;
}

.status-badge {
  padding:0.4rem 1rem;
  border-radius:20px;
  font-size:0.8rem;
  font-weight:600;
}

.card {
  background: rgba(255,255,255,0.03);
  border:1px solid rgba(220,38,38,0.2);
  border-radius:20px;
  padding:1.5rem;
  margin-bottom:1.5rem;
}

.alert {
  background: rgba(220,38,38,0.1);
  border:1px solid rgba(220,38,38,0.4);
  padding:1rem;
  border-radius:15px;
  margin-bottom:1rem;
}

.alert strong { color:#f87171; }

.btn {
  padding:0.6rem 1.2rem;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
  margin-right:0.5rem;
  margin-top:0.5rem;
}

.accept { background:#10b981; color:#0b1219; }
.decline { background:#ef4444; color:white; }

select {
  padding:0.6rem 1rem;
  border-radius:12px;
  border:1px solid rgba(220,38,38,0.3);
  background:rgba(0,0,0,0.3);
  color:white;
  margin-top:0.5rem;
}

table { width:100%; border-collapse:collapse; }
th, td {
  padding:0.8rem;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
th { font-size:0.85rem; color:#94a3b8; }

.loading-text { color:#94a3b8; font-size:0.9rem; }
</style>
</head>

<body>

<div class="sidebar">
  <div>
    <div class="logo">Crimson<span>Shield</span></div>
    <div class="nav">
      <button onclick="goDashboard()">Dashboard</button>
      <button onclick="goEligibility()">Update Eligibility</button>
      <button onclick="goRewards()">Rewards</button>
      <button onclick="goFeedback()">Feedback</button>
      <button onclick="goProfile()">Profile</button>
    </div>
  </div>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="main">

  <div class="header">
    <h1 id="welcomeMsg">Welcome 👋</h1>
    <span class="status-badge" id="headerStatus" style="background:#10b981;color:#0b1219;">
      Available
    </span>
  </div>

  <div class="card">
    <h3>🚨 Active Blood Requests</h3>
    <div id="requestsContainer">
      <p class="loading-text">Loading requests…</p>
    </div>
  </div>

  <div class="card">
    <h3>Availability Status</h3>

    <button class="btn accept" onclick="setAvailable()"> Available Now</button>

    <div style="margin-top:1rem;">
      <label style="color:#94a3b8;font-size:0.9rem;">
        Not Available For:
      </label><br>
      <select id="timeSelect">
        <option value="1800000">30 Minutes</option>
        <option value="3600000">1 Hour</option>
      </select>
      <button class="btn decline" onclick="setNotAvailable()">
        Set Not Available
      </button>
    </div>

    <div id="availabilityText" style="margin-top:1rem;font-weight:600;">
      Current Status: Available for Emergency Calls
    </div>
  </div>

  <div class="card">
    <h3>🩸 Recent Donations</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Hospital</th>
          <th>Blood Group</th>
        </tr>
      </thead>
      <tbody id="donationsBody">
        <tr><td colspan="3" class="loading-text">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
let currentUserId = null;
let availabilityTimer;

requireDonorAuth(async function(session, profile) {
  currentUserId = session.user.id;
  const name = profile ? profile.name : session.user.email;
  document.getElementById("welcomeMsg").textContent = "Welcome, " + name + " 👋";

  // Set initial availability UI
  if (profile && profile.is_available === false) {
    updateAvailabilityUI(false);
  }

  // Load blood requests
  loadRequests();

  // Load recent donations
  loadDonations();
});

async function loadRequests() {
  const container = document.getElementById("requestsContainer");
  try {
    const { data, error } = await supabaseClient
      .from("blood_requests")
      .select("*")
      .eq("status", "pending")
      .order("created_at", { ascending: false })
      .limit(5);

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = '<p class="loading-text">No active requests right now.</p>';
      return;
    }

    container.innerHTML = data.map(function(req) {
      return '<div class="alert">' +
        '<strong>' + req.blood_group + ' Blood Required</strong><br/>' +
        (req.hospital_name || 'Hospital') + ' · ' + req.units + ' Units' +
        '<br/><br/>' +
        '<button class="btn accept" onclick="respond(\'' + req.id + '\', \'accepted\')">Accept</button>' +
        '<button class="btn decline" onclick="respond(\'' + req.id + '\', \'declined\')">Decline</button>' +
      '</div>';
    }).join("");
  } catch (err) {
    container.innerHTML = '<p class="loading-text">No active requests right now.</p>';
  }
}

async function loadDonations() {
  const tbody = document.getElementById("donationsBody");
  try {
    const { data, error } = await supabaseClient
      .from("blood_requests")
      .select("*")
      .eq("status", "fulfilled")
      .order("created_at", { ascending: false })
      .limit(5);

    if (error) throw error;

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="loading-text">No donations recorded yet.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(function(d) {
      var date = new Date(d.created_at).toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" });
      return '<tr><td>' + date + '</td><td>' + (d.hospital_name || '—') + '</td><td>' + d.blood_group + '</td></tr>';
    }).join("");
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="3" class="loading-text">No donations recorded yet.</td></tr>';
  }
}

async function respond(requestId, status) {
  try {
    await supabaseClient
      .from("blood_requests")
      .update({ status: status })
      .eq("id", requestId);
    alert("You have " + status + " the request.");
    loadRequests();
  } catch (err) {
    alert("Error updating request.");
  }
}

async function setAvailable() {
  clearTimeout(availabilityTimer);
  updateAvailabilityUI(true);

  if (currentUserId) {
    await supabaseClient
      .from("donors")
      .update({ is_available: true })
      .eq("user_id", currentUserId);
  }
}

async function setNotAvailable() {
  const selectedTime = parseInt(document.getElementById("timeSelect").value);
  updateAvailabilityUI(false);

  if (currentUserId) {
    await supabaseClient
      .from("donors")
      .update({ is_available: false })
      .eq("user_id", currentUserId);
  }

  clearTimeout(availabilityTimer);
  availabilityTimer = setTimeout(setAvailable, selectedTime);
}

function updateAvailabilityUI(available) {
  const badge = document.getElementById("headerStatus");
  const text = document.getElementById("availabilityText");
  if (available) {
    text.innerText = "Current Status: Available for Emergency Calls";
    text.style.color = "#10b981";
    badge.style.background = "#10b981";
    badge.style.color = "#0b1219";
    badge.innerText = "Available";
  } else {
    text.innerText = "Current Status: Not Available";
    text.style.color = "#f87171";
    badge.style.background = "#ef4444";
    badge.style.color = "white";
    badge.innerText = "Not Available";
  }
}

/* Navigation */
function goDashboard(){ window.location.href="donor-dashboard.html"; }
function goEligibility(){ window.location.href="update-health.html"; }
function goProfile(){ window.location.href="donor-profile.html"; }
function goRewards(){ window.location.href="donor-rewards.html"; }
function goFeedback(){ window.location.href="donor-feedback.html"; }
function logout(){ performLogout("../index.html"); }
</script>

</body>
</html>
