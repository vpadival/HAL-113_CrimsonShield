<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics · Crimson Shield</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827);
  color:#e5e7eb;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#0b1220;
  border-right:1px solid rgba(220,38,38,0.15);
  padding:2rem 1.5rem;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  font-size:1.6rem;
  font-weight:800;
  margin-bottom:2.5rem;
}
.logo span{color:#b91c1c;}

.nav button{
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  border-radius:15px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  cursor:pointer;
  transition:0.3s;
}

.nav button:hover,
.nav button.active{
  background:rgba(220,38,38,0.15);
  color:white;
}

.logout{
  background:#b91c1c;
  border:none;
  padding:0.75rem;
  border-radius:12px;
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* MAIN */
.main{flex:1;padding:2rem;}

.header h1{
  font-size:1.9rem;
  margin-bottom:2rem;
}

/* STAT CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:1.5rem;
  margin-bottom:2.5rem;
}

.stat-card{
  background:#111827;
  border:1px solid rgba(185,28,28,0.15);
  border-radius:18px;
  padding:1.5rem;
  transition:0.3s;
}

.stat-card:hover{
  transform:translateY(-4px);
  border-color:#b91c1c;
}

.stat-card h2{
  font-size:2rem;
  color:#b91c1c;
}

.stat-card p{
  color:#9ca3af;
  margin-top:0.4rem;
}

/* CHARTS */
.charts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
  gap:2rem;
}

.chart-card{
  background:#111827;
  border:1px solid rgba(185,28,28,0.15);
  border-radius:18px;
  padding:1.5rem;
}

.chart-card h3{
  margin-bottom:1rem;
  font-weight:600;
}

canvas{margin-top:0.5rem;}
</style>
</head>
<body>

<div class="sidebar">
  <div>
    <div class="logo">Crimson<span>Shield</span></div>
    <div class="nav">
      <button onclick="goDashboard()">Dashboard</button>
      <button onclick="goAddDonor()">Add Donor</button>
      <button onclick="goFindBlood()">Find Blood</button>
      <button onclick="goTrackDonor()">Track Donor</button>
      <button class="active" onclick="goAnalytics()">Analytics</button>
      <button onclick="goProfile()">Profile</button>
    </div>
  </div>
  <button class="logout" onclick="performLogout('../index.html')">Logout</button>
</div>

<div class="main">

  <div class="header">
    <h1>Hospital Analytics Dashboard</h1>
  </div>

  <div class="stats">
    <div class="stat-card"><h2 id="sTotalReq">…</h2><p>Total Requests</p></div>
    <div class="stat-card"><h2 id="sFulfilled">…</h2><p>Successful Matches</p></div>
    <div class="stat-card"><h2 id="sActiveDonors">…</h2><p>Active Donors</p></div>
    <div class="stat-card"><h2 id="sPending">…</h2><p>Pending Requests</p></div>
  </div>

  <div class="charts">

    <div class="chart-card">
      <h3>Monthly Blood Requests</h3>
      <canvas id="lineChart"></canvas>
    </div>

    <div class="chart-card">
      <h3>Blood Group Distribution</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="chart-card">
      <h3>Request Status Overview</h3>
      <canvas id="barChart"></canvas>
    </div>

  </div>

</div>

<!-- Supabase SDK + shared config + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
/* ── Navigation ── */
function goDashboard()  { window.location.href="admin-dashboard.html"; }
function goAddDonor()   { window.location.href="add-eligible-donor.html"; }
function goFindBlood()  { window.location.href="contact-network.html"; }
function goTrackDonor() { window.location.href="ambulance-tracking.html"; }
function goAnalytics()  { window.location.href="analytics.html"; }
function goProfile()    { window.location.href="admin-profile.html"; }

/* ── Auth guard + Load analytics ── */
onSupabaseReady(function() {
requireAdminAuth();

/* ── Chart palette ── */
const gridColor = "rgba(255,255,255,0.05)";
const textColor = "#9ca3af";

(async function loadAnalytics() {
  try {
    /* ---- stat cards ---- */
    const { count: totalReq } = await supabaseClient
      .from("blood_requests").select("*", { count:"exact", head:true });
    document.getElementById("sTotalReq").textContent = totalReq ?? 0;

    const { count: fulfilled } = await supabaseClient
      .from("blood_requests").select("*", { count:"exact", head:true })
      .eq("status","fulfilled");
    document.getElementById("sFulfilled").textContent = fulfilled ?? 0;

    const { count: pending } = await supabaseClient
      .from("blood_requests").select("*", { count:"exact", head:true })
      .eq("status","pending");
    document.getElementById("sPending").textContent = pending ?? 0;

    const { count: activeDonors } = await supabaseClient
      .from("donors").select("*", { count:"exact", head:true })
      .eq("is_available", true);
    document.getElementById("sActiveDonors").textContent = activeDonors ?? 0;

    /* ---- Monthly line chart (last 6 months) ---- */
    const { data: allReqs } = await supabaseClient
      .from("blood_requests").select("created_at");

    const monthCounts = {};
    const now = new Date();
    const labels = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = d.toISOString().slice(0,7);
      const label = d.toLocaleString("default",{month:"short"});
      labels.push(label);
      monthCounts[key] = 0;
    }

    if (allReqs) {
      allReqs.forEach(r => {
        const key = (r.created_at || "").slice(0,7);
        if (key in monthCounts) monthCounts[key]++;
      });
    }

    new Chart(document.getElementById("lineChart"),{
      type:"line",
      data:{
        labels: labels,
        datasets:[{
          label:"Requests",
          data: Object.values(monthCounts),
          borderColor:"#b91c1c",
          backgroundColor:"rgba(185,28,28,0.15)",
          fill:true,
          tension:0.4,
          pointBackgroundColor:"#b91c1c"
        }]
      },
      options:{
        plugins:{legend:{labels:{color:textColor}}},
        scales:{
          x:{ticks:{color:textColor},grid:{color:gridColor}},
          y:{ticks:{color:textColor},grid:{color:gridColor}}
        }
      }
    });

    /* ---- Blood group pie chart ---- */
    const { data: donors } = await supabaseClient
      .from("donors").select("blood_group");

    const groupCounts = {};
    if (donors) {
      donors.forEach(d => {
        const g = d.blood_group || "Unknown";
        groupCounts[g] = (groupCounts[g] || 0) + 1;
      });
    }

    const pieLabels = Object.keys(groupCounts);
    const pieData   = Object.values(groupCounts);
    const pieColors = ["#b91c1c","#334155","#0f766e","#92400e","#6d28d9","#0369a1","#c2410c","#4d7c0f"];

    new Chart(document.getElementById("pieChart"),{
      type:"doughnut",
      data:{
        labels: pieLabels.length ? pieLabels : ["No data"],
        datasets:[{
          data: pieData.length ? pieData : [1],
          backgroundColor: pieColors.slice(0, pieLabels.length || 1),
          borderWidth:0
        }]
      },
      options:{
        plugins:{legend:{labels:{color:textColor}}}
      }
    });

    /* ---- Request status bar chart ---- */
    const statusLabels = ["pending","fulfilled","rejected","cancelled"];
    const statusCounts = [];
    for (const s of statusLabels) {
      const { count } = await supabaseClient
        .from("blood_requests").select("*", { count:"exact", head:true })
        .eq("status", s);
      statusCounts.push(count ?? 0);
    }

    new Chart(document.getElementById("barChart"),{
      type:"bar",
      data:{
        labels: statusLabels.map(s => s.charAt(0).toUpperCase()+s.slice(1)),
        datasets:[{
          data: statusCounts,
          backgroundColor:"#334155",
          borderRadius:6
        }]
      },
      options:{
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:textColor},grid:{color:gridColor}},
          y:{ticks:{color:textColor},grid:{color:gridColor}}
        }
      }
    });

  } catch(err) {
    console.error("Analytics load error:", err);
  }
})();
}); // onSupabaseReady
</script>

</body>
</html>
