<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Profile · Crimson Shield</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: linear-gradient(135deg, #0b1219 0%, #151f2c 100%);
  color:#e2e8f0;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background:rgba(18,25,35,0.95);
  border-right:1px solid rgba(220,38,38,0.2);
  padding:2rem 1.5rem;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo {
  font-size:1.6rem;
  font-weight:800;
  margin-bottom:2.5rem;
}
.logo span { color:#dc2626; }

.nav button {
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  border-radius:15px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  cursor:pointer;
  transition:0.3s;
}

.nav button:hover,
.nav button.active {
  background:rgba(220,38,38,0.15);
  color:white;
}

.logout {
  background:#dc2626;
  border:none;
  padding:0.8rem;
  border-radius:15px;
  color:white;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* MAIN */
.main {
  flex:1;
  padding:2rem;
}

.header h1 {
  font-size:1.8rem;
  margin-bottom:2rem;
}

/* PROFILE CARD */
.profile-card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(220,38,38,0.2);
  border-radius:20px;
  padding:2rem;
  display:flex;
  gap:2rem;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:2rem;
}

.profile-avatar {
  width:140px;
  height:140px;
  border-radius:20px;
  border:3px solid #dc2626;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:3.5rem;
  font-weight:800;
  color:#dc2626;
}

.profile-info h2 { margin-bottom:0.5rem; }

.profile-info p {
  color:#94a3b8;
  margin-bottom:0.4rem;
}

.profile-actions {
  margin-top:1rem;
}

.btn {
  padding:0.7rem 1.2rem;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-weight:600;
}

.btn-edit { background:#3b82f6; color:white; }
.btn-save { background:#10b981; color:#0b1219; }
.btn-cancel { background:#64748b; color:white; }

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:100;
}

.modal-content {
  background:#151f2c;
  padding:2rem;
  border-radius:20px;
  width:90%;
  max-width:400px;
  border:1px solid rgba(220,38,38,0.3);
}

.modal-content h3 {
  margin-bottom:1rem;
}

.modal-content input {
  width:100%;
  padding:0.7rem;
  margin-bottom:1rem;
  border-radius:10px;
  border:1px solid rgba(220,38,38,0.2);
  background:#0b1219;
  color:white;
}

.modal-buttons {
  display:flex;
  justify-content:space-between;
}

.error-msg {
  color:#ef4444;
  font-size:0.85rem;
  margin-bottom:1rem;
  display:none;
}

.success-msg {
  color:#10b981;
  font-size:0.85rem;
  margin-bottom:1rem;
  display:none;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div>
    <div class="logo">Crimson<span>Shield</span></div>
    <div class="nav">
      <button onclick="goDashboard()">Dashboard</button>
      <button onclick="goAddDonor()">Add Donor</button>
      <button onclick="goFindBlood()">Find Blood</button>
      <button onclick="goTrackDonor()">Track Donor</button>
      <button onclick="goAnalytics()">Analytics</button>
      <button class="active" onclick="goProfile()">Profile</button>
    </div>
  </div>
  <button class="logout" onclick="performLogout('../index.html')">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <h1>Hospital Profile</h1>
  </div>

  <div id="successMsg" class="success-msg">Profile updated successfully!</div>

  <div class="profile-card">
    <div class="profile-avatar" id="profileAvatar">H</div>

    <div class="profile-info">
      <h2 id="hospitalName">Loading…</h2>
      <p id="hospitalLocation">—</p>
      <p id="hospitalEmail">—</p>
      <p id="hospitalPhone">—</p>

      <div class="profile-actions">
        <button class="btn btn-edit" onclick="openModal()">Edit Hospital Details</button>
      </div>
    </div>
  </div>

</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Hospital Details</h3>
    <div id="editError" class="error-msg"></div>
    <input type="text" id="editName" placeholder="Hospital Name">
    <input type="text" id="editLocation" placeholder="Location / City">
    <input type="email" id="editEmail" placeholder="Email">
    <input type="text" id="editPhone" placeholder="Phone">

    <div class="modal-buttons">
      <button class="btn btn-save" id="saveBtn" onclick="saveChanges()">Save</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Supabase SDK + shared config + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
/* ── Navigation ── */
function goDashboard()  { window.location.href="admin-dashboard.html"; }
function goAddDonor()   { window.location.href="add-eligible-donor.html"; }
function goFindBlood()  { window.location.href="contact-network.html"; }
function goTrackDonor() { window.location.href="ambulance-tracking.html"; }
function goAnalytics()  { window.location.href="analytics.html"; }
function goProfile()    { window.location.href="admin-profile.html"; }

/* ── Auth guard + Load profile ── */
onSupabaseReady(function() {
requireAdminAuth();

let hospitalId = null;

(async function loadProfile() {
  try {
    const session = await getSession();
    if (!session) return;

    const { data, error } = await supabaseClient
      .from("hospitals")
      .select("*")
      .eq("admin_user_id", session.user.id)
      .single();

    if (error || !data) {
      // Fallback: try first hospital row
      const { data: firstHosp } = await supabaseClient
        .from("hospitals").select("*").limit(1).single();

      if (firstHosp) renderProfile(firstHosp);
      else {
        document.getElementById("hospitalName").textContent = "No hospital profile found";
      }
      return;
    }

    renderProfile(data);
  } catch(err) {
    console.error("Profile load error:", err);
  }
})();
}); // onSupabaseReady

function renderProfile(h) {
  hospitalId = h.id;
  document.getElementById("hospitalName").textContent     = h.name || "Unnamed Hospital";
  document.getElementById("hospitalLocation").textContent = h.city || h.address || "—";
  document.getElementById("hospitalEmail").textContent    = h.email || "—";
  document.getElementById("hospitalPhone").textContent    = h.phone || "—";
  document.getElementById("profileAvatar").textContent    = (h.name || "H").charAt(0).toUpperCase();
}

/* ── Modal ── */
function openModal() {
  document.getElementById("editModal").style.display = "flex";
  document.getElementById("editError").style.display = "none";
  document.getElementById("editName").value     = document.getElementById("hospitalName").textContent;
  document.getElementById("editLocation").value = document.getElementById("hospitalLocation").textContent === "—" ? "" : document.getElementById("hospitalLocation").textContent;
  document.getElementById("editEmail").value    = document.getElementById("hospitalEmail").textContent === "—" ? "" : document.getElementById("hospitalEmail").textContent;
  document.getElementById("editPhone").value    = document.getElementById("hospitalPhone").textContent === "—" ? "" : document.getElementById("hospitalPhone").textContent;
}

function closeModal() {
  document.getElementById("editModal").style.display = "none";
}

async function saveChanges() {
  const name     = document.getElementById("editName").value.trim();
  const location = document.getElementById("editLocation").value.trim();
  const email    = document.getElementById("editEmail").value.trim();
  const phone    = document.getElementById("editPhone").value.trim();
  const errEl    = document.getElementById("editError");

  if (!name) {
    errEl.textContent = "Hospital name is required.";
    errEl.style.display = "block";
    return;
  }

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.textContent = "Saving…";
  saveBtn.disabled = true;

  try {
    if (hospitalId) {
      const { error } = await supabaseClient
        .from("hospitals")
        .update({ name, city: location, email, phone })
        .eq("id", hospitalId);

      if (error) throw error;
    }

    // Update UI
    document.getElementById("hospitalName").textContent     = name;
    document.getElementById("hospitalLocation").textContent = location || "—";
    document.getElementById("hospitalEmail").textContent    = email || "—";
    document.getElementById("hospitalPhone").textContent    = phone || "—";
    document.getElementById("profileAvatar").textContent    = name.charAt(0).toUpperCase();

    closeModal();

    const suc = document.getElementById("successMsg");
    suc.style.display = "block";
    setTimeout(() => suc.style.display = "none", 3000);

  } catch(err) {
    errEl.textContent = "Failed to save: " + (err.message || err);
    errEl.style.display = "block";
  } finally {
    saveBtn.textContent = "Save";
    saveBtn.disabled = false;
  }
}
</script>

</body>
</html>
