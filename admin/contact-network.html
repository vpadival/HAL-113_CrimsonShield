<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Network · Crimson Shield</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: linear-gradient(135deg, #0b1219 0%, #151f2c 100%);
  color:#e2e8f0;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background:rgba(18,25,35,0.95);
  border-right:1px solid rgba(220,38,38,0.2);
  padding:2rem 1.5rem;
  display:flex;
  flex-direction:column;
}

.logo {
  font-size:1.6rem;
  font-weight:800;
  margin-bottom:3rem;
}
.logo span { color:#dc2626; }

.nav button {
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  border-radius:15px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  cursor:pointer;
  transition:0.3s;
}

.nav button:hover,
.nav button.active {
  background:rgba(220,38,38,0.15);
  color:white;
}

.sidebar-footer{
  margin-top:auto;
}

.logout{
  background:#dc2626;
  border:none;
  padding:0.8rem;
  border-radius:15px;
  color:white;
  cursor:pointer;
  width:100%;
}

/* MAIN */
.main {
  flex:1;
  padding:2rem;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:2rem;
}

.header h1 { font-size:1.8rem; }

/* FILTER SECTION */
.filter-section {
  margin-bottom:2rem;
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
}

.filter-section input,
.filter-section select {
  padding:0.7rem;
  border-radius:10px;
  border:1px solid rgba(220,38,38,0.2);
  background:rgba(0,0,0,0.3);
  color:white;
  min-width:180px;
}

/* GRID */
.network-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:1.5rem;
}

.network-card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(220,38,38,0.2);
  border-radius:20px;
  padding:1.5rem;
  transition:0.3s;
}

.network-card:hover {
  border-color:rgba(220,38,38,0.5);
  transform:translateY(-4px);
}

.network-card h3 {
  margin-bottom:0.5rem;
  color:white;
}

.network-card p {
  font-size:0.9rem;
  color:#94a3b8;
  margin-bottom:0.4rem;
}

.status {
  font-weight:600;
  margin-bottom:1rem;
}

.available { color:#10b981; }
.low { color:#f59e0b; }
.unavailable { color:#ef4444; }

.actions {
  display:flex;
  gap:0.5rem;
  flex-wrap:wrap;
}

.btn {
  padding:0.5rem 0.9rem;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-size:0.8rem;
  font-weight:600;
  transition:0.2s;
}

.btn-call { background:#10b981; color:#0b1219; }
.btn-email { background:#3b82f6; color:white; }
.btn-request { background:#dc2626; color:white; }

.btn:hover { opacity:0.85; }

.response-message {
  margin-top:1rem;
  font-size:0.85rem;
  color:#94a3b8;
}

.empty-state {
  text-align:center;
  padding:3rem;
  color:#64748b;
}
</style>
</head>
<body>

<div class="sidebar">
  <div>
    <div class="logo">Crimson<span>Shield</span></div>
    <div class="nav">
      <button onclick="goDashboard()">Dashboard</button>
      <button onclick="goAddDonor()">Add Donor</button>
      <button class="active" onclick="goFindBlood()">Find Blood</button>
      <button onclick="goTrackDonor()">Track Donor</button>
      <button onclick="goAnalytics()">Analytics</button>
      <button onclick="goProfile()">Profile</button>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="logout" onclick="performLogout('../index.html')">Logout</button>
  </div>
</div>

<div class="main">

  <div class="header">
    <h1>Hospital, Blood Bank & Donor Network</h1>
  </div>

  <div class="filter-section">
    <input type="text" id="searchInput" placeholder="Search by name…" onkeyup="applyFilters()">

    <select id="typeFilter" onchange="applyFilters()">
      <option value="all">All Types</option>
      <option value="hospital">Hospitals</option>
      <option value="donor">Donors</option>
    </select>

    <select id="bloodFilter" onchange="applyFilters()">
      <option value="all">All Blood Groups</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
    </select>

    <select id="statusFilter" onchange="applyFilters()">
      <option value="all">All Availability</option>
      <option value="available">Available</option>
      <option value="unavailable">Unavailable</option>
    </select>
  </div>

  <div class="network-grid" id="networkGrid">
    <div class="empty-state">Loading network…</div>
  </div>

</div>

<!-- Supabase SDK + shared config + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
/* ── Navigation ── */
function goDashboard()  { window.location.href="admin-dashboard.html"; }
function goAddDonor()   { window.location.href="add-eligible-donor.html"; }
function goFindBlood()  { window.location.href="contact-network.html"; }
function goTrackDonor() { window.location.href="ambulance-tracking.html"; }
function goAnalytics()  { window.location.href="analytics.html"; }
function goProfile()    { window.location.href="admin-profile.html"; }

/* ── Auth guard + Load network ── */
onSupabaseReady(function() {
requireAdminAuth();

/* ── Data store ── */
let allCards = [];

(async function loadNetwork() {
  const grid = document.getElementById("networkGrid");
  grid.innerHTML = "";

  try {
    // Load donors
    const { data: donors } = await supabaseClient.from("donors").select("*");
    if (donors) {
      donors.forEach(d => {
        const card = makeCard({
          type: "donor",
          name: d.name || "Unknown Donor",
          location: d.city || d.address || "—",
          blood_group: d.blood_group || "—",
          phone: d.phone || "",
          email: d.email || "",
          is_available: d.is_available !== false,
          donor_id: d.user_id || d.id || ""
        });
        allCards.push(card);
        grid.appendChild(card.el);
      });
    }

    // Load hospitals
    const { data: hospitals } = await supabaseClient.from("hospitals").select("*");
    if (hospitals) {
      hospitals.forEach(h => {
        const card = makeCard({
          type: "hospital",
          name: h.name || "Unknown Hospital",
          location: h.city || h.address || "—",
          blood_group: h.blood_group || "All",
          phone: h.phone || "",
          email: h.email || "",
          is_available: h.is_available !== false
        });
        allCards.push(card);
        grid.appendChild(card.el);
      });
    }

    if (!allCards.length) {
      grid.innerHTML = '<div class="empty-state">No donors or hospitals found in the database.</div>';
    }

  } catch(err) {
    console.error("Network load error:", err);
    grid.innerHTML = '<div class="empty-state">Failed to load network data.</div>';
  }
})();

}); // onSupabaseReady

/* ── Request action (global, called from onclick) ── */
async function sendRequest(button) {
  const card    = button.closest(".network-card");
  const msgBox  = card.querySelector(".response-message");
  const blood   = card.dataset.blood;
  const donorId = card.dataset.donorId;

  button.disabled = true;
  msgBox.innerHTML = "⏳ Sending request...";

  try {
    const client = window.supabaseClient;
    if (!client) throw new Error("Supabase not ready, please try again.");

    const { error } = await client
      .from("blood_requests")
      .insert([{
        blood_group: blood,
        status:      "pending",
        urgency:     "urgent",
        units:       1
      }]);

    if (error) throw error;
    msgBox.innerHTML = "✅ Blood Reserved Successfully";
  } catch(e) {
    msgBox.innerHTML = "❌ Failed: " + e.message;
    button.disabled = false;
  }
}

function makeCard(info) {
  const el = document.createElement("div");
  el.className = "network-card";
  el.dataset.type     = info.type;
  el.dataset.blood    = info.blood_group;
  el.dataset.status   = info.is_available ? "available" : "unavailable";
  el.dataset.donorId  = info.donor_id || "";
  el.dataset.donorName = info.name || "";

  const statusClass = info.is_available ? "available" : "unavailable";
  const statusText  = info.is_available ? "Available" : "Unavailable";

  el.innerHTML = `
    <h3>${info.name}</h3>
    <p>📍 ${info.location}</p>
    <p>🩸 Blood Group: ${info.blood_group}</p>
    ${info.phone ? `<p>📞 ${info.phone}</p>` : ""}
    <p class="status ${statusClass}">${statusText}</p>
    <div class="actions">
      ${info.phone ? `<button class="btn btn-call" onclick="window.open('tel:${info.phone}')">Call</button>` : ""}
      ${info.email ? `<button class="btn btn-email" onclick="window.open('mailto:${info.email}')">Email</button>` : ""}
      <button class="btn btn-request" onclick="sendRequest(this)">Request</button>
    </div>
    <div class="response-message"></div>
  `;

  return { ...info, el };
}

/* ── Filters ── */
function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const type   = document.getElementById("typeFilter").value;
  const blood  = document.getElementById("bloodFilter").value;
  const status = document.getElementById("statusFilter").value;

  allCards.forEach(c => {
    const matchSearch = c.name.toLowerCase().includes(search);
    const matchType   = type   === "all" || c.type === type;
    const matchBlood  = blood  === "all" || c.blood_group === blood;
    const matchStatus = status === "all" || c.el.dataset.status === status;

    c.el.style.display = (matchSearch && matchType && matchBlood && matchStatus) ? "block" : "none";
  });
}


</script>

</body>
</html>
