<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard · Crimson Shield</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: linear-gradient(135deg, #0b1219 0%, #151f2c 100%);
  color: #e2e8f0;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background:rgba(18,25,35,0.95);
  border-right:1px solid rgba(220,38,38,0.2);
  padding:2rem 1.5rem;
  display:flex;
  flex-direction:column;
}

.logo {
  font-size:1.6rem;
  font-weight:800;
  margin-bottom:3rem;
}
.logo span { color:#dc2626; }

.nav button {
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  border-radius:15px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  cursor:pointer;
  transition:0.3s;
}

.nav button:hover,
.nav button.active {
  background:rgba(220,38,38,0.15);
  color:white;
}

.sidebar-footer{
  margin-top:auto;
}

.logout {
  background:#dc2626;
  border:none;
  padding:0.8rem;
  border-radius:15px;
  color:white;
  cursor:pointer;
  width:100%;
}

/* MAIN */
.main {
  flex:1;
  padding:2rem;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:2rem;
}

.status-indicator {
  background:#10b981;
  padding:0.4rem 1rem;
  border-radius:20px;
  font-size:0.8rem;
  color:#0b1219;
  font-weight:600;
}

/* STATS */
.stats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1.5rem;
  margin-bottom:2rem;
}

.card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(220,38,38,0.2);
  padding:1.5rem;
  border-radius:20px;
}

.card h3 {
  font-size:0.85rem;
  color:#94a3b8;
}

.card .value {
  font-size:2rem;
  font-weight:700;
  margin-top:0.5rem;
}

.loading-value {
  color:#64748b;
}

/* PRIORITY BOX */
.priority-box {
  background:rgba(220,38,38,0.1);
  border:1px solid rgba(220,38,38,0.4);
  padding:1rem;
  border-radius:15px;
  margin-bottom:2rem;
}

/* BLOOD STOCK */
.stock-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1rem;
  margin-bottom:2rem;
}

.stock-card {
  background:rgba(255,255,255,0.03);
  border-radius:15px;
  padding:1rem;
  text-align:center;
}

.stock-card span {
  display:block;
  font-size:1.4rem;
  font-weight:700;
  margin-top:0.5rem;
}

/* RECENT TABLE */
.recent-section {
  margin-top:2rem;
}

.recent-section h2 {
  margin-bottom:1rem;
}

.recent-table {
  width:100%;
  border-collapse:collapse;
}

.recent-table th,
.recent-table td {
  padding:0.75rem 1rem;
  text-align:left;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.recent-table th {
  color:#94a3b8;
  font-size:0.8rem;
  text-transform:uppercase;
}

.badge {
  padding:0.2rem 0.6rem;
  border-radius:10px;
  font-size:0.75rem;
  font-weight:600;
}

.badge-pending   { background:rgba(245,158,11,0.2); color:#f59e0b; }
.badge-fulfilled { background:rgba(16,185,129,0.2); color:#10b981; }
.badge-urgent    { background:rgba(239,68,68,0.2);  color:#ef4444; }
</style>
</head>
<body>

<div class="sidebar">
  <div>
    <div class="logo">Crimson<span>Shield</span></div>

    <div class="nav">
      <button class="active" onclick="goDashboard()">Dashboard</button>
      <button onclick="goAddDonor()">Add Donor</button>
      <button onclick="goFindBlood()">Find Blood</button>
      <button onclick="goTrackDonor()">Track Donor</button>
      <button onclick="goAnalytics()">Analytics</button>
      <button onclick="goProfile()">Profile</button>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="logout" onclick="performLogout('../index.html')">Logout</button>
  </div>
</div>

<div class="main">

  <div class="header">
    <h1>Admin Dashboard</h1>
    <span class="status-indicator">System Online</span>
  </div>

  <div class="stats">
    <div class="card">
      <h3>Active Emergencies</h3>
      <div class="value" id="statEmergencies"><span class="loading-value">…</span></div>
    </div>
    <div class="card">
      <h3>Total Donors</h3>
      <div class="value" id="statDonors"><span class="loading-value">…</span></div>
    </div>
    <div class="card">
      <h3>Pending Requests</h3>
      <div class="value" id="statPending"><span class="loading-value">…</span></div>
    </div>
    <div class="card">
      <h3>Fulfilled Cases</h3>
      <div class="value" id="statFulfilled"><span class="loading-value">…</span></div>
    </div>
  </div>

  <div class="priority-box" id="priorityBox" style="display:none;">
    🚨 <strong>High Priority:</strong> <span id="priorityText"></span>
  </div>

  <h2>Blood Stock Overview</h2>
  <div class="stock-grid" id="stockGrid">
    <!-- Populated dynamically -->
  </div>

  <div class="recent-section">
    <h2>Recent Blood Requests</h2>
    <table class="recent-table">
      <thead>
        <tr>
          <th>Blood Group</th>
          <th>Units</th>
          <th>Hospital</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="recentBody">
        <tr><td colspan="5" style="color:#64748b;">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Supabase SDK + shared config + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
/* ── Navigation ── */
function goDashboard()  { window.location.href="admin-dashboard.html"; }
function goAddDonor()   { window.location.href="add-eligible-donor.html"; }
function goFindBlood()  { window.location.href="contact-network.html"; }
function goTrackDonor() { window.location.href="ambulance-tracking.html"; }
function goAnalytics()  { window.location.href="analytics.html"; }
function goProfile()    { window.location.href="admin-profile.html"; }

/* ── Auth guard + Load dashboard data ── */
onSupabaseReady(function() {
requireAdminAuth();
(async function loadDashboard() {
  try {
    // Total donors count
    const { count: donorCount } = await supabaseClient
      .from("donors").select("*", { count: "exact", head: true });
    document.getElementById("statDonors").textContent = donorCount ?? 0;

    // Pending requests
    const { count: pendingCount } = await supabaseClient
      .from("blood_requests").select("*", { count: "exact", head: true })
      .eq("status", "pending");
    document.getElementById("statEmergencies").textContent = pendingCount ?? 0;
    document.getElementById("statPending").textContent = pendingCount ?? 0;

    // Fulfilled requests
    const { count: fulfilledCount } = await supabaseClient
      .from("blood_requests").select("*", { count: "exact", head: true })
      .eq("status", "fulfilled");
    document.getElementById("statFulfilled").textContent = fulfilledCount ?? 0;

    // Blood stock
    const { data: stockData } = await supabaseClient
      .from("blood_stock").select("*");

    const stockGrid = document.getElementById("stockGrid");
    if (stockData && stockData.length) {
      stockGrid.innerHTML = stockData.map(s =>
        `<div class="stock-card">${s.blood_group} <span>${s.units ?? 0}</span></div>`
      ).join("");
    } else {
      // Fallback: show common groups with 0
      const groups = ["O+","O-","A+","A-","B+","B-","AB+","AB-"];
      stockGrid.innerHTML = groups.map(g =>
        `<div class="stock-card">${g} <span>0</span></div>`
      ).join("");
    }

    // Priority: show most urgent pending request
    const { data: urgentReq } = await supabaseClient
      .from("blood_requests").select("*")
      .eq("status", "pending")
      .order("created_at", { ascending: true })
      .limit(1);

    if (urgentReq && urgentReq.length) {
      const r = urgentReq[0];
      document.getElementById("priorityText").textContent =
        `${r.blood_group} blood required${r.hospital ? " at " + r.hospital : ""} (${r.units ?? 1} Unit${(r.units ?? 1) > 1 ? "s" : ""})`;
      document.getElementById("priorityBox").style.display = "block";
    }

    // Recent requests table
    const { data: recentReqs } = await supabaseClient
      .from("blood_requests").select("*")
      .order("created_at", { ascending: false })
      .limit(10);

    const tbody = document.getElementById("recentBody");
    if (recentReqs && recentReqs.length) {
      tbody.innerHTML = recentReqs.map(r => {
        const statusClass = r.status === "fulfilled" ? "badge-fulfilled"
                          : r.status === "pending"   ? "badge-pending"
                          : "badge-urgent";
        const date = r.created_at ? new Date(r.created_at).toLocaleDateString() : "—";
        return `<tr>
          <td>${r.blood_group || "—"}</td>
          <td>${r.units ?? 1}</td>
          <td>${r.hospital || "—"}</td>
          <td><span class="badge ${statusClass}">${r.status || "pending"}</span></td>
          <td>${date}</td>
        </tr>`;
      }).join("");
    } else {
      tbody.innerHTML = '<tr><td colspan="5" style="color:#64748b;">No requests yet</td></tr>';
    }

  } catch (err) {
    console.error("Dashboard load error:", err);
  }
})();
}); // onSupabaseReady
</script>

</body>
</html>
