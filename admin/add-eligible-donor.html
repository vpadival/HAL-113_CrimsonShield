<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Eligible Donor · Crimson Shield</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:linear-gradient(135deg,#0b1219 0%,#151f2c 100%);
  color:#e2e8f0;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:rgba(18,25,35,0.95);
  border-right:1px solid rgba(220,38,38,0.2);
  padding:2rem 1.5rem;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:1.6rem;
  font-weight:800;
  margin-bottom:3rem;
}
.logo span{ color:#dc2626; }

.nav button{
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  border-radius:15px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  cursor:pointer;
  transition:0.3s;
}

.nav button:hover,
.nav button.active{
  background:rgba(220,38,38,0.15);
  color:white;
}

.sidebar-footer{
  margin-top:auto;
}

.logout{
  background:#dc2626;
  border:none;
  padding:0.8rem;
  border-radius:15px;
  color:white;
  cursor:pointer;
  width:100%;
}

/* MAIN */
.main{
  flex:1;
  padding:2rem;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
.header{
  width:100%;
  max-width:600px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:2rem;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(220,38,38,0.2);
  border-radius:20px;
  padding:2rem;
  width:100%;
  max-width:600px;
  margin-bottom:2rem;
}

.card input,
.card select{
  width:100%;
  padding:0.8rem;
  margin-bottom:1rem;
  border-radius:10px;
  border:1px solid rgba(220,38,38,0.2);
  background:rgba(0,0,0,0.3);
  color:white;
}

.card label{
  font-size:0.9rem;
  color:#94a3b8;
  margin-bottom:0.4rem;
  display:block;
}

.consent-box{
  background:rgba(255,255,255,0.02);
  padding:1rem;
  border-radius:10px;
  border:1px solid rgba(220,38,38,0.2);
  margin-bottom:1rem;
}

.button-center{
  display:flex;
  justify-content:center;
  margin-top:1.5rem;
}

.btn{
  background:linear-gradient(145deg,#dc2626,#b91c1c);
  color:white;
  padding:0.9rem 2rem;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}

.btn:hover{
  opacity:0.9;
  transform:translateY(-2px);
}

.btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
  transform:none;
}

/* CSV DROP ZONE */
.drop-zone{
  border:2px dashed rgba(220,38,38,0.6);
  border-radius:15px;
  padding:2rem;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.drop-zone.dragover{
  background:rgba(220,38,38,0.1);
  border-color:#dc2626;
}

.error-msg{
  color:#ef4444;
  font-size:0.85rem;
  margin-bottom:1rem;
  display:none;
}

.success-msg{
  color:#10b981;
  font-size:0.85rem;
  margin-bottom:1rem;
  display:none;
}

.csv-results{
  margin-top:1rem;
  font-size:0.85rem;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="sidebar">
  <div>
    <div class="logo">Crimson<span>Shield</span></div>

    <div class="nav">
      <button onclick="goDashboard()">Dashboard</button>
      <button class="active" onclick="goAddDonor()">Add Donor</button>
      <button onclick="goFindBlood()">Find Blood</button>
      <button onclick="goTrackDonor()">Track Donor</button>
      <button onclick="goAnalytics()">Analytics</button>
      <button onclick="goProfile()">Profile</button>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="logout" onclick="performLogout('../index.html')">Logout</button>
  </div>
</div>

<div class="main">

  <div class="header">
    <h1>🩸 Add Eligible Donor</h1>
  </div>

  <!-- MANUAL ENTRY -->
  <div class="card">
    <div id="formError" class="error-msg"></div>
    <div id="formSuccess" class="success-msg"></div>

    <label>Donor Name</label>
    <input type="text" id="name">

    <label>Email Address</label>
    <input type="email" id="email">

    <label>Contact Number</label>
    <input type="text" id="phone">

    <label>Gender</label>
    <select id="gender">
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label>Blood Group</label>
    <select id="blood">
      <option value="">Select Blood Group</option>
      <option>O+</option>
      <option>O-</option>
      <option>A+</option>
      <option>A-</option>
      <option>B+</option>
      <option>B-</option>
      <option>AB+</option>
      <option>AB-</option>
    </select>

    <label>Last Donation Date</label>
    <input type="date" id="lastDonation">

    <div class="consent-box">
      <input type="checkbox" id="medicalConsent">
      <label for="medicalConsent">
        I confirm that the donor has voluntarily agreed to share their personal and medical eligibility details and has provided informed consent.
      </label>
    </div>

    <div class="button-center">
      <button class="btn" id="addBtn" onclick="addDonor()">Add Donor</button>
    </div>

  </div>

  <!-- CSV UPLOAD -->
  <div class="card">
    <h3>Upload Donors via CSV</h3>
    <p style="color:#64748b;font-size:0.8rem;margin:0.5rem 0 1rem;">
      CSV columns: name, email, phone, gender, blood_group, last_donation_date
    </p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('csvFile').click()">
      Drag & Drop CSV file here<br>or Click to Select
      <input type="file" id="csvFile" accept=".csv" hidden>
    </div>
    <div class="csv-results" id="csvResults"></div>
  </div>

</div>

<!-- Supabase SDK + shared config + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>

<script>
/* ── Navigation ── */
function goDashboard()  { window.location.href="admin-dashboard.html"; }
function goAddDonor()   { window.location.href="add-eligible-donor.html"; }
function goFindBlood()  { window.location.href="contact-network.html"; }
function goTrackDonor() { window.location.href="ambulance-tracking.html"; }
function goAnalytics()  { window.location.href="analytics.html"; }
function goProfile()    { window.location.href="admin-profile.html"; }

/* ── Auth guard ── */
requireAdminAuth();

/* ── Set max date ── */
document.getElementById("lastDonation").max = new Date().toISOString().split("T")[0];

/* ── Validation helpers ── */
function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function checkDonationEligibility(dateStr) {
  if (!dateStr) return true;
  const last  = new Date(dateStr);
  const today = new Date();
  const diff  = (today - last) / (1000 * 60 * 60 * 24);
  return diff >= 90;
}

/* ── Add single donor ── */
async function addDonor() {
  const errEl = document.getElementById("formError");
  const sucEl = document.getElementById("formSuccess");
  errEl.style.display = "none";
  sucEl.style.display = "none";

  const name    = document.getElementById("name").value.trim();
  const email   = document.getElementById("email").value.trim();
  const phone   = document.getElementById("phone").value.trim();
  const gender  = document.getElementById("gender").value;
  const blood   = document.getElementById("blood").value;
  const lastDon = document.getElementById("lastDonation").value;
  const consent = document.getElementById("medicalConsent").checked;

  // Validation
  if (!name || !email || !phone || !gender || !blood) {
    errEl.textContent = "Please fill in all required fields.";
    errEl.style.display = "block";
    return;
  }
  if (!validateEmail(email)) {
    errEl.textContent = "Please enter a valid email address.";
    errEl.style.display = "block";
    return;
  }
  if (!consent) {
    errEl.textContent = "Medical consent is required.";
    errEl.style.display = "block";
    return;
  }
  if (lastDon && !checkDonationEligibility(lastDon)) {
    errEl.textContent = "Donor must have last donated at least 90 days ago.";
    errEl.style.display = "block";
    return;
  }

  const btn = document.getElementById("addBtn");
  btn.textContent = "Adding…";
  btn.disabled = true;

  try {
    const { error } = await supabaseClient.from("donors").insert({
      name,
      email,
      phone,
      gender,
      blood_group: blood,
      last_donation_date: lastDon || null,
      is_available: true
    });

    if (error) throw error;

    // Clear form
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("gender").value = "";
    document.getElementById("blood").value = "";
    document.getElementById("lastDonation").value = "";
    document.getElementById("medicalConsent").checked = false;

    sucEl.textContent = "Donor added successfully!";
    sucEl.style.display = "block";
    setTimeout(() => sucEl.style.display = "none", 4000);

  } catch(err) {
    errEl.textContent = "Failed to add donor: " + (err.message || err);
    errEl.style.display = "block";
  } finally {
    btn.textContent = "Add Donor";
    btn.disabled = false;
  }
}

/* ── CSV upload ── */
const dropZone = document.getElementById("dropZone");
const csvFile  = document.getElementById("csvFile");
const csvResults = document.getElementById("csvResults");

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    processCSV(e.dataTransfer.files[0]);
  }
});

csvFile.addEventListener("change", () => {
  if (csvFile.files.length) processCSV(csvFile.files[0]);
});

async function processCSV(file) {
  csvResults.innerHTML = "⏳ Processing CSV…";

  try {
    const text = await file.text();
    const lines = text.trim().split("\n");
    if (lines.length < 2) {
      csvResults.innerHTML = "⚠️ CSV appears empty (need header + data rows).";
      return;
    }

    const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
    const nameIdx   = headers.indexOf("name");
    const emailIdx  = headers.indexOf("email");
    const phoneIdx  = headers.indexOf("phone");
    const genderIdx = headers.indexOf("gender");
    const bloodIdx  = headers.findIndex(h => h.includes("blood"));
    const dateIdx   = headers.findIndex(h => h.includes("donation") || h.includes("date"));

    if (nameIdx === -1 || bloodIdx === -1) {
      csvResults.innerHTML = "⚠️ CSV must have at least 'name' and 'blood_group' columns.";
      return;
    }

    const donors = [];
    let skipped = 0;

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(",").map(c => c.trim());
      const name = cols[nameIdx];
      const blood = cols[bloodIdx];

      if (!name || !blood) { skipped++; continue; }

      donors.push({
        name,
        email: emailIdx > -1 ? cols[emailIdx] : null,
        phone: phoneIdx > -1 ? cols[phoneIdx] : null,
        gender: genderIdx > -1 ? cols[genderIdx] : null,
        blood_group: blood,
        last_donation_date: dateIdx > -1 && cols[dateIdx] ? cols[dateIdx] : null,
        is_available: true
      });
    }

    if (!donors.length) {
      csvResults.innerHTML = "⚠️ No valid rows found in CSV.";
      return;
    }

    const { error } = await supabaseClient.from("donors").insert(donors);
    if (error) throw error;

    csvResults.innerHTML = `✅ Successfully added ${donors.length} donor(s).${skipped ? ` (${skipped} row(s) skipped)` : ""}`;

  } catch(err) {
    csvResults.innerHTML = "❌ CSV import failed: " + (err.message || err);
  }
}
</script>

</body>
</html>
